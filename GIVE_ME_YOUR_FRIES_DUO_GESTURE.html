<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GIVE ME YOUR FRIES! — 海鸥薯条大赛</title>
<style>
:root{--ink:#273a4c;--cream:#fff9e4;--gold:#ffd878;--coral:#ff8375;--blue:#90c7ef}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Arial Rounded MT Bold",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(ellipse at 10% 10%,#fff9d7 0,transparent 42%),repeating-linear-gradient(135deg,transparent 0 33px,#e0e7df 33px 34px),#ebf0e9}
.wrap{max-width:1245px;margin:auto;padding:clamp(12px,3vw,30px)}
.heading{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:17px}
h1{font-size:clamp(27px,5vw,56px);line-height:1;margin:0 0 5px;letter-spacing:-.04em;text-shadow:3px 3px #fff6cc}
h1 em{color:#d95a53;font-style:normal}
.sub,.help{font-size:13px;color:#4d626c;line-height:1.55}
.actions{display:flex;align-items:center;flex-wrap:wrap;gap:9px}
button,.upload{display:inline-flex;justify-content:center;align-items:center;min-height:38px;cursor:pointer;font:inherit;font-size:13px;font-weight:800;border:2px solid var(--ink);background:#fffbf0;color:var(--ink);border-radius:9px;padding:7px 12px;box-shadow:2px 3px 0 var(--ink)}
button:enabled:hover,.upload:hover{transform:translateY(-1px)}
button:enabled:active,.upload:active{transform:translate(2px,3px);box-shadow:none}
button:disabled{opacity:.48;cursor:default}
button:focus-visible,.upload:focus-within{outline:3px solid #387bb1;outline-offset:3px}
button.primary,[aria-pressed="true"]{background:var(--gold)}
.upload{position:relative}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.setup,.game{border:4px solid var(--ink);border-radius:19px;box-shadow:7px 8px 0 #263a4c28;overflow:hidden}
.setup{background:#fff9e9;padding:clamp(15px,4vw,34px)}
.setup h2{margin:0 0 10px;font-size:clamp(21px,3vw,27px)}
.modeRow{padding-bottom:19px;border-bottom:2px dashed #d7b99b}
.photoGrid{display:grid;grid-template-columns:1fr 1.05fr;gap:clamp(15px,3vw,28px);align-items:start;margin:21px 0}
.photoCards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.photoCards.solo{grid-template-columns:minmax(0,1fr)}
.photoCard{display:grid;justify-items:center;gap:8px;padding:12px 6px;background:#fff0bc;border:2px solid #c79a55;border-radius:13px;text-align:center}
.photoCard.blue{background:#e3f2fc;border-color:#84b3d4}
.portrait,.avatarDot{display:grid;place-items:center;overflow:hidden;border:2px solid var(--ink);border-radius:50%;background:#ffdb78}
.portrait{width:62px;height:62px;font-size:32px}
.blue .portrait,.avatarDot.blue{background:#aed9f4}
.portrait img,.avatarDot img{width:100%;height:100%;object-fit:cover;grid-area:1/1}
.photoCard strong{font-size:14px}
.photoCard .upload{font-size:12px;min-height:32px;padding:5px 8px}
.setupCamera{min-width:0;background:#e9f3ec;border:2px solid #9db9b4;border-radius:14px;padding:11px}
.setupCamera .actions{margin-top:8px}
.cameraPlaceholder{margin:0;padding:17px 4px 11px}
.cameraStatus{margin:8px 0 0;font-size:12px;line-height:1.45;color:#315e5a}
.cameraStatus.error{color:#a33132}
.startRow{border-top:2px dashed #d7b99b;padding-top:16px}
.startRow p{margin:9px 0 0}
.game{background:#75cbd2}
.ribbon{display:flex;background:#fff0be;border-bottom:3px solid var(--ink)}
.playerhud{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:8px 12px}
#playerHud2{background:#e4f2fc;border-left:2px dashed var(--ink)}
.tag{display:grid;gap:3px;font-size:14px}.tag small{font-size:11px;color:#4d626c}
.avatarDot{width:35px;height:35px;flex:none}
.hudNumbers{margin-left:auto;text-align:right;font-size:12px;font-weight:800}
.hudNumbers b{font-size:18px;color:#a13f36}.action{display:block;font-size:11px;color:#315a70}
.action.danger{color:#a0202b}
#gameCanvas{display:block;width:100%;height:auto;touch-action:none}
.foot{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px 15px;background:#fff9e8;border-top:3px solid var(--ink);padding:12px}
.status{flex:1 1 290px;min-width:0;font-size:14px;font-weight:800}
.status p{margin:5px 0 0}
.ribbon:has(#gameCameraDock .livebox:not([hidden])){
  display:grid;grid-template-columns:minmax(0,1fr) clamp(135px,23%,250px) minmax(0,1fr);
  background:linear-gradient(90deg,#fff0be 50%,#e4f2fc 50%)
}
.ribbon:has(#gameCameraDock .livebox:not([hidden])) #playerHud2{border-left:0}
.ribbon:has(#playerHud2[hidden]){background:#fff0be}
#gameCameraDock{display:none}
#gameCameraDock:has(.livebox:not([hidden])){display:block;position:relative;z-index:1;align-self:end;margin:7px 4px -7px}
.livebox{position:relative;overflow:hidden;border:2px solid var(--ink);border-radius:9px;background:#203649;aspect-ratio:16/9}
.livebox video,.livebox canvas,.photoGuides{position:absolute;inset:0;width:100%;height:100%}
.livebox video{transform:scaleX(-1)}
.livebox canvas,.photoGuides{pointer-events:none}
.photoGuide{position:absolute;transform:translate(-50%,-50%);border:2px dashed #ffda73;border-radius:50%;box-shadow:0 0 0 2px #263a4c88}
.photoGuide.blue{border-color:#91d2ff}
.camLabels{position:absolute;bottom:4px;left:7px;right:7px;display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 3px #102538}
dialog{width:min(480px,calc(100% - 30px));border:4px solid var(--ink);border-radius:18px;background:var(--cream);color:var(--ink);padding:22px;box-shadow:6px 7px 0 #17283c}
dialog::backdrop{background:#17283cb5}
dialog h2{margin:0 0 9px}dialog p{line-height:1.55}
@media(max-width:650px){.photoGrid{grid-template-columns:1fr}.playerhud{padding:6px;gap:5px;flex-wrap:wrap}.tag{font-size:12px}.tag small,.action{font-size:10px}.avatarDot{width:26px;height:26px}.hudNumbers b{font-size:15px}}
@media(max-width:500px){
  .ribbon:has(#gameCameraDock .livebox:not([hidden])){grid-template-columns:repeat(2,minmax(0,1fr))}
  .ribbon:has(#playerHud2[hidden]) .playerhud:first-child{grid-column:1/-1}
  #gameCameraDock:has(.livebox:not([hidden])){grid-column:1/-1;grid-row:2;width:min(45%,185px);justify-self:center;margin-top:1px}
}
</style>
</head>
<body>
<main class="wrap">
  <header class="heading">
    <div><h1>GIVE ME YOUR <em>FRIES!</em> 🍟</h1><div class="sub">海鸥薯条大赛 · 抓薯条，带回自己的巢</div></div>
    <div class="actions" id="gameActions" hidden>
      <button id="changeMode">模式与头像</button>
      <button id="sound">🔊 音效</button>
      <button id="rules">玩法</button>
      <button id="restart">重新开局</button>
    </div>
  </header>

  <section class="setup" id="setup" aria-labelledby="modeTitle">
    <div class="modeRow">
      <h2 id="modeTitle">选择模式</h2>
      <div class="actions" role="group" aria-label="游戏模式">
        <button id="soloMode" aria-pressed="false">单人模式</button>
        <button id="duoMode" aria-pressed="true">双人模式</button>
      </div>
    </div>
    <div class="photoGrid">
      <div>
        <h2>开局前拍头像</h2>
        <p class="help" id="photoHelp">两人分别站在画面左右，将脸对准取景框。照片只在当前页面使用。</p>
        <div class="photoCards" id="photoCards">
          <div class="photoCard">
            <span class="portrait"><span>🐤</span><img id="photo1" alt="P1 的头像" hidden></span>
            <strong>P1 · 金帽海鸥</strong>
            <label class="upload">上传 P1 头像<input id="face1" type="file" accept="image/*"></label>
          </div>
          <div class="photoCard blue" id="photoCard2">
            <span class="portrait"><span>🐤</span><img id="photo2" alt="P2 的头像" hidden></span>
            <strong>P2 · 蓝巾海鸥</strong>
            <label class="upload">上传 P2 头像<input id="face2" type="file" accept="image/*"></label>
          </div>
        </div>
        <button id="useDefaults">使用默认头像</button>
      </div>
      <div class="setupCamera">
        <div id="setupCameraDock">
          <div class="livebox" id="livebox" hidden>
            <video id="video" autoplay muted playsinline></video>
            <canvas id="handCanvas" width="480" height="270" aria-hidden="true" hidden></canvas>
            <div class="photoGuides" id="photoGuides" aria-hidden="true"><i class="photoGuide" id="guide1"></i><i class="photoGuide blue" id="guide2"></i></div>
            <div class="camLabels" id="camLabels" hidden><span id="camP1">🟡 左侧 P1</span><span id="camP2">🔵 右侧 P2</span></div>
          </div>
        </div>
        <p class="help cameraPlaceholder" id="cameraPlaceholder">开启摄像头后，就可以对着取景框拍照。</p>
        <div class="actions">
          <button id="cameraBtn">📷 开启摄像头</button>
          <button id="snapFaces" disabled>拍摄头像</button>
        </div>
        <p class="cameraStatus" id="cameraNote" role="status">手势识别首次加载需要联网。</p>
      </div>
    </div>
    <div class="startRow">
      <div class="actions">
        <button class="primary" id="goCamera" disabled>手势开始</button>
        <button id="goKeyboard" disabled>键盘开始</button>
      </div>
      <p class="help" id="setupHint" role="status">拍摄、上传或选择默认头像后开始。</p>
    </div>
  </section>

  <section class="game" id="game" aria-label="海鸥薯条大赛" hidden>
    <div class="ribbon">
      <div class="playerhud">
        <span class="avatarDot"><span>🐤</span><img id="hudPhoto1" alt="" hidden></span>
        <span class="tag"><strong>P1 · 金帽海鸥</strong><small id="round1"></small></span>
        <span class="hudNumbers"><b id="score1">0</b> 分 · 脚抓 <span id="carry1">0</span>/4 · <span id="hp1">♥♥♥</span><span class="action" id="action1"></span></span>
      </div>
      <div id="gameCameraDock"></div>
      <div class="playerhud" id="playerHud2">
        <span class="avatarDot blue"><span>🐤</span><img id="hudPhoto2" alt="" hidden></span>
        <span class="tag"><strong>P2 · 蓝巾海鸥</strong><small id="round2"></small></span>
        <span class="hudNumbers"><b id="score2">0</b> 分 · 脚抓 <span id="carry2">0</span>/4 · <span id="hp2">♥♥♥</span><span class="action" id="action2"></span></span>
      </div>
    </div>
    <canvas id="gameCanvas" width="1120" height="600" aria-label="两只海鸥共用的海港地图"></canvas>
    <div class="foot">
      <div class="status">
        <div id="clockText"></div>
        <p id="message" role="status"></p>
        <p class="help" id="inGameHint"></p>
        <p class="cameraStatus" id="cameraFeedback" role="status" hidden></p>
        <div class="actions" style="margin-top:8px">
          <button id="retryModel" hidden>重试手势识别</button>
          <button id="useKeyboard" hidden>切换键盘</button>
        </div>
      </div>
    </div>
  </section>
</main>
<dialog id="dialog" aria-labelledby="dialogTitle">
  <h2 id="dialogTitle"></h2>
  <p id="dialogText"></p>
  <div class="actions">
    <button class="primary" id="dialogAction"></button>
    <button id="dialogClose" hidden>继续游戏</button>
  </div>
</dialog>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('gameCanvas'), ctx = canvas.getContext('2d');
const video = $('video'), handCanvas = $('handCanvas'), hctx = handCanvas.getContext('2d');
const W = canvas.width, H = canvas.height, TAU = Math.PI * 2;
const MAX_FRIES = 4;
const GUARD_RADIUS = 150;
const GUARD_WARNING_SECONDS = [1.65, 1.5, 1.35];
const GUARD_IMPACT_SECONDS = .42;
const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
const dist = (x, y, xx, yy) => Math.hypot(x - xx, y - yy);
const rand = (min, max) => min + Math.random() * (max - min);

const maps = [
  {
    name: '阳光长码头', sea: ['#b0ecdb', '#65c4ce'], plank: '#eeb982',
    nests: [[108, 468], [1000, 419]],
    food: [[192, 230], [397, 215], [609, 293], [789, 431], [947, 209], [235, 446]],
    guards: [[319, 258], [704, 281], [886, 373]],
    land: [
      [[68, 165], [500, 165], [500, 237], [848, 237], [848, 141], [1034, 141], [1034, 237],
        [1044, 237], [1044, 475], [721, 475], [721, 351], [500, 351], [500, 306], [276, 306], [276, 526], [68, 526]]
    ],
    sign: ['NO SEAGULLS', 314, 192], props: [['⛵', 431, 431], ['🐟', 577, 500], ['🛟', 1088, 359]]
  },
  {
    name: '日落鱼骨市场', sea: ['#f7d3aa', '#64bac7'], plank: '#dfa073',
    nests: [[111, 203], [996, 470]],
    food: [[254, 230], [541, 236], [846, 252], [416, 433], [691, 408], [966, 379]],
    guards: [[373, 256], [625, 271], [731, 438], [932, 414]],
    land: [
      [[68, 151], [921, 151], [921, 298], [765, 298], [765, 478], [614, 478], [614, 298], [472, 298], [472, 500], [355, 500], [355, 298], [68, 298]],
      [[861, 327], [1058, 327], [1058, 529], [861, 529]]
    ],
    bridges: [[[752, 389], [879, 389], [879, 425], [752, 425]]],
    sign: ['FISH MARKET', 554, 182], props: [['🦐', 269, 410], ['🛟', 538, 398], ['⛵', 1043, 209]]
  },
  {
    name: '碎裂暴风海港', sea: ['#9bd8cd', '#4d8eaf'], plank: '#b7988b',
    nests: [[125, 440], [996, 197]],
    food: [[163, 199], [315, 442], [478, 228], [670, 361], [865, 462], [897, 199]],
    guards: [[239, 230], [508, 202], [432, 411], [747, 407], [957, 239]],
    land: [
      [[65, 144], [302, 144], [302, 278], [65, 278]],
      [[386, 145], [560, 145], [560, 295], [386, 295]],
      [[828, 141], [1052, 141], [1052, 278], [828, 278]],
      [[64, 367], [437, 367], [437, 520], [64, 520]],
      [[591, 305], [795, 305], [795, 419], [946, 419], [946, 520], [591, 520]]
    ],
    bridges: [
      [[289, 205], [401, 205], [401, 235], [289, 235]],
      [[147, 261], [178, 261], [204, 383], [173, 383]],
      [[428, 435], [606, 413], [606, 447], [428, 469]],
      [[756, 312], [832, 249], [858, 263], [778, 329]]
    ],
    sign: ['⚠ STORM DOCK', 182, 168], props: [['🪨', 325, 312], ['⚓', 978, 344], ['🐙', 506, 532]]
  }
];

const players = [0, 1].map(id => ({id, avatar:null, avatarVersion:0, total:0}));
const playerName = p => p.id === 0 ? '金帽海鸥' : '蓝巾海鸥';
let mode = 'duo', phase = 'setup', controlMode = 'keyboard';
let level = 0, remain = 65, time = 0, last = performance.now();
let food = [], guards = [], guardAttacks = [], effects = [], trayDrag = null;
let defaultsAccepted = false, muted = false, audio = null;
const keys = new Set();
const activePlayers = () => mode === 'solo' ? [players[0]] : players;
const nestXY = p => maps[level].nests[p.id];
const announce = message => { $('message').textContent = message; };

function setMode(next) {
  mode = next;
  const solo = mode === 'solo';
  $('soloMode').setAttribute('aria-pressed', solo);
  $('duoMode').setAttribute('aria-pressed', !solo);
  $('photoCard2').hidden = solo;
  $('photoCards').classList.toggle('solo', solo);
  $('playerHud2').hidden = solo;
  $('camP2').hidden = solo;
  $('camP1').textContent = solo ? '🟡 P1 · 全画幅' : '🟡 左侧 P1';
  $('photoHelp').textContent = solo
    ? '把脸对准取景框中央。照片只在当前页面使用。'
    : '两人分别站在画面左右，将脸对准取景框。照片只在当前页面使用。';
  canvas.setAttribute('aria-label', solo ? '单人海鸥海港地图' : '两只海鸥共用的海港地图');
  updatePhotoGuides();
  updateSetup();
}

function updateSetup() {
  const ready = defaultsAccepted || activePlayers().every(p => p.avatar);
  $('goCamera').disabled = !ready || starting;
  $('goKeyboard').disabled = !ready;
  $('soloMode').disabled = starting;
  $('duoMode').disabled = starting;
  $('snapFaces').disabled = video.readyState < 2 || !stream || starting;
  $('setupHint').textContent = starting ? '正在准备手势模式，也可以直接开始键盘模式。' :
    ready ? '头像已就绪，可以开始。' : '拍摄、上传或选择默认头像后开始。';
}

function updateHUD() {
  for (const p of activePlayers()) {
    const j = p.id + 1;
    $('score' + j).textContent = p.score + '（总 ' + p.total + '）';
    $('carry' + j).textContent = p.carry;
    $('hp' + j).textContent = '♥'.repeat(p.hp) + '♡'.repeat(3 - p.hp);
    $('round' + j).textContent = maps[level].name;
    const warning = guardAttacks.find(attack => !attack.fired && insideGuardCircle(p, attack));
    let action = '键盘操控';
    if (warning) action = '⚠️ 飞出红圈 · ' + warningTime(warning) + 's';
    else if (p.stun > 0) action = '💫 被击晕';
    else if (p.auto) action = '🏠 回巢交货';
    else if (p.grip) action = '🤏 俯冲抓取';
    else if (controlMode === 'camera') action = p.seen ? '🖐️ 飞行' : '等待手入镜';
    const actionLabel = $('action' + j);
    actionLabel.textContent = action;
    actionLabel.classList.toggle('danger', Boolean(warning));
  }
  $('clockText').textContent = '第 ' + (level + 1) + ' / ' + maps.length + ' 关 · ' + Math.ceil(remain) + ' 秒';
}

function setControl(next) {
  keys.clear();
  for (const p of players) clearTracking(p);
  controlMode = next;
  handCanvas.hidden = true;
  $('useKeyboard').hidden = next !== 'camera';
  const flightHint = next === 'camera'
    ? (mode === 'solo' ? '在整个镜头内' : '在各自半边镜头内') + '张手飞行，捏合抓取，松手回巢。'
    : 'P1 用 WASD 飞行，按住 F 抓取。' + (mode === 'duo' ? 'P2 用方向键飞行，按住 K 抓取。' : '') + '松键回巢。';
  $('inGameHint').textContent = flightHint + '用鼠标或手指把薯条盒摆在陆地上。游客警戒时，倒计时结束前飞出红圈。';
}

function setupRound(n) {
  cancelTrayDrag();
  level = n;
  remain = 65 + n * 10;
  time = 0;
  keys.clear();
  effects = [];
  guardAttacks = [];
  for (const p of activePlayers()) {
    const [x, y] = nestXY(p);
    Object.assign(p, {x, y, aimX:x, aimY:y, carry:0, score:0, hp:3, grip:false, auto:false,
      stun:0, invuln:0, stealClock:0, bumpCooldown:0, seen:false, pinched:false, openFrames:0, handTrack:null});
  }
  food = maps[n].food.map(([x, y], id) => ({id, x, y, count:MAX_FRIES, regen:0}));
  guards = maps[n].guards.map(([x, y], id) => ({id, x, y}));
  phase = 'playing';
  announce('🍟 去码头抓薯条，带回自己的巢计分！');
  updateHUD();
  sound('start');
}

function resetMatch() {
  for (const p of players) p.total = 0;
  setupRound(0);
}

function endRound() {
  phase = 'results';
  cancelTrayDrag();
  const active = activePlayers();
  for (const p of active) {
    clearTracking(p);
    p.total += p.score;
  }
  const final = level === maps.length - 1;
  const [a, b] = active;
  let title = final ? '单人挑战完成！' : '本关完成！';
  if (b) {
    const field = final ? 'total' : 'score';
    title = a[field] === b[field] ? '两只海鸥打成平手！' : playerName(a[field] > b[field] ? a : b) + '获胜！';
  }
  const summary = active.map(p => playerName(p) + ' 本关 ' + p.score + ' 分，累计 ' + p.total + ' 分').join('。');
  sound('finish');
  showDialog(title, summary + '。', final ? '再来一局' : '下一关',
    final ? resetMatch : () => setupRound(level + 1));
}

function showDialog(title, text, action, onAction, dismissible = false) {
  const dialog = $('dialog');
  $('dialogTitle').textContent = title;
  $('dialogText').textContent = text;
  $('dialogAction').textContent = action;
  $('dialogClose').hidden = !dismissible;
  $('dialogClose').onclick = () => { dialog.close(); phase = 'playing'; };
  dialog.oncancel = event => {
    event.preventDefault();
    if (dismissible) $('dialogClose').click();
  };
  $('dialogAction').onclick = () => { dialog.close(); onAction(); };
  dialog.showModal();
}

function pauseGame() {
  phase = 'paused';
  keys.clear();
  cancelTrayDrag();
  for (const p of activePlayers()) clearTracking(p);
}

function enableAudio() {
  if (muted) return;
  try {
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    audio.resume();
  } catch {}
}
function tone(f,d=.12,w='triangle',v=.065,slide=1,delay=0){if(muted||!audio)return;try{const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type=w;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(50,f*slide),t+d);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+d+.025)}catch(e){}}
function sound(k){if(k==='steal'){tone(680,.12,'square',.035,1.5);tone(1100,.11,'sine',.05,1.05,.08)}else if(k==='deposit'){[510,680,900].forEach((f,i)=>tone(f,.16,'triangle',.065,1.07,i*.1))}else if(k==='bonk'){tone(260,.32,'sawtooth',.12,.21);tone(130,.18,'square',.065,1.8,.11)}else if(k==='finish'){[392,520,650,800].forEach((f,i)=>tone(f,.22,'triangle',.065,1.04,i*.12))}else if(k==='start'){[380,520,720].forEach((f,i)=>tone(f,.19,'triangle',.065,1.14,i*.12))}}
function sparkle(x,y,color='#fff4a1',n=12){for(let i=0;i<n;i++)effects.push({x,y,vx:rand(-145,145),vy:rand(-190,90),life:rand(.3,.7),color,r:rand(2.5,6)})}
function oval(x,y,rx,ry,color,stroke=null,lw=2){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}

function releaseGrip(p, returnHome = false) {
  const wasGripping = p.grip;
  p.grip = false;
  p.stealClock = 0;
  if (returnHome && wasGripping && p.carry > 0) p.auto = true;
}

function clearTracking(p, rememberHand = false) {
  releaseGrip(p);
  p.auto = false;
  p.aimX = p.x;
  p.aimY = p.y;
  p.seen = false;
  p.pinched = false;
  p.openFrames = 0;
  if (!rememberHand) p.handTrack = null;
}

function hit(p, rival) {
  if (rival && (p.invuln > 0 || p.hp <= 0)) return;
  p.hp = Math.max(0, p.hp - 1);
  const dropped = p.carry;
  p.carry = 0;
  releaseGrip(p);
  p.auto = false;
  p.stun = 1;
  p.invuln = 2.3;
  p.bumpCooldown = 1.5;
  sparkle(p.x, p.y, '#ff7775', 22);
  sound('bonk');
  const message = (rival ? '💥 对手撞到了' : '💥 游客击中了') + playerName(p);
  announce(message + (dropped ? '，掉落 ' + dropped + ' 根薯条。' : '！'));
}

const keyBindings = [
  {left:'KeyA', right:'KeyD', up:'KeyW', down:'KeyS', grip:'KeyF'},
  {left:'ArrowLeft', right:'ArrowRight', up:'ArrowUp', down:'ArrowDown', grip:'KeyK'}
];

function updateKeyboard(p, dt) {
  const {left, right, up, down, grip} = keyBindings[p.id];
  const dx = Number(keys.has(right)) - Number(keys.has(left));
  const dy = Number(keys.has(down)) - Number(keys.has(up));
  const length = Math.hypot(dx, dy) || 1;
  if (!p.auto) {
    p.aimX = clamp(p.aimX + dx / length * 360 * dt, 40, W - 40);
    p.aimY = clamp(p.aimY + dy / length * 360 * dt, 100, H - 45);
  }
  if (keys.has(grip) && p.stun <= 0 && !p.auto) p.grip = true;
}

function updatePlayer(p, dt) {
  p.invuln = Math.max(0, p.invuln - dt);
  p.stun = Math.max(0, p.stun - dt);
  p.bumpCooldown = Math.max(0, p.bumpCooldown - dt);
  if (controlMode === 'camera' && !p.seen) return;
  if (controlMode === 'keyboard') updateKeyboard(p, dt);

  const [homeX, homeY] = nestXY(p);
  const targetX = p.auto ? homeX : p.aimX;
  const targetY = p.auto ? homeY : p.aimY;
  const distance = dist(p.x, p.y, targetX, targetY);
  const flightSpeed = controlMode === 'camera' ? 880 : 460;
  if (p.stun <= 0 && distance > 0) {
    const amount = Math.min(1, dt * (p.auto ? 640 : flightSpeed) / distance);
    p.x += (targetX - p.x) * amount;
    p.y += (targetY - p.y) * amount;
  }

  if (!p.grip && p.carry > 0 && dist(p.x, p.y, homeX, homeY) < 23) {
    p.score += p.carry;
    announce('🏡 ' + playerName(p) + '带回 ' + p.carry + ' 根薯条！');
    p.carry = 0;
    sparkle(p.x, p.y, '#ffe190', 18);
    sound('deposit');
    if (p.auto && controlMode === 'keyboard') {
      p.aimX = homeX;
      p.aimY = homeY;
    }
    p.auto = false;
  }

  const tray = p.grip && p.carry < MAX_FRIES ? nearestTray(p) : null;
  if (!tray) {
    p.stealClock = 0;
    return;
  }
  p.stealClock += dt;
  if (p.stealClock < .44) return;
  p.stealClock = 0;
  p.carry++;
  tray.count--;
  if (tray.count === 0) tray.regen = 4;
  sparkle(p.x, p.y + 37, '#ffe39a', 8);
  sound('steal');
  if (p.carry === MAX_FRIES) announce('🍟 ' + playerName(p) + '抓满了，松手回巢！');
  beginGuardWarning(tray, p);
}

function nearestTray(p) {
  let closest = null;
  let distance = 68;
  for (const tray of food) {
    if (!tray.count || trayDrag?.tray === tray) continue;
    const gap = dist(p.x, p.y + 28, tray.x, tray.y);
    if (gap < distance) {
      closest = tray;
      distance = gap;
    }
  }
  return closest;
}

function bumpPlayers(a, b) {
  if (dist(a.x, a.y, b.x, b.y) >= 64) return;
  const attacker = [a, b].find(p => p.grip && p.bumpCooldown === 0);
  if (!attacker) return;
  attacker.bumpCooldown = 2;
  hit(attacker === a ? b : a, true);
}

function insideGuardCircle(player, attack) {
  return dist(player.x, player.y + 28, attack.x, attack.y) <= GUARD_RADIUS;
}

function warningTime(attack) {
  return (Math.ceil(Math.max(0, attack.strikeAt - time) * 10) / 10).toFixed(1);
}

function beginGuardWarning(tray, player) {
  const alreadyWarned = guardAttacks.some(attack => !attack.fired && attack.tray === tray &&
    dist(attack.trayX, attack.trayY, tray.x, tray.y) < GUARD_RADIUS / 2 && insideGuardCircle(player, attack));
  if (alreadyWarned) return;

  const guard = guards.reduce((nearest, candidate) =>
    dist(candidate.x, candidate.y, tray.x, tray.y) < dist(nearest.x, nearest.y, tray.x, tray.y)
      ? candidate : nearest);
  // Nearby visitors defend their own position. Distant visitors aim toward the gull.
  const targetY = player.y + 28;
  const reach = dist(guard.x, guard.y, player.x, targetY);
  const shift = reach > 92 ? 1 - 92 / reach : 0;
  const x = guard.x + (player.x - guard.x) * shift;
  const y = guard.y + (targetY - guard.y) * shift;
  guardAttacks.push({guard, tray, trayX:tray.x, trayY:tray.y, x, y,
    strikeAt:time + GUARD_WARNING_SECONDS[level], fired:false});
  announce('⚠️ 游客发现了偷薯条的海鸥！倒计时结束前飞出红圈。');
  tone(470, .11, 'square', .045, 1.28);
  tone(685, .15, 'square', .035, .85, .11);
  updateHUD();
}

function updateGuardAttacks(active) {
  const struck = new Set();
  for (let i = guardAttacks.length - 1; i >= 0; i--) {
    const attack = guardAttacks[i];
    if (!attack.fired && time >= attack.strikeAt) {
      attack.fired = true;
      sparkle(attack.x, attack.y, '#fff0bd', 16);
      tone(175, .23, 'sawtooth', .07, .52);
      for (const p of active) {
        if (insideGuardCircle(p, attack)) struck.add(p);
      }
    }
    if (time >= attack.strikeAt + GUARD_IMPACT_SECONDS) guardAttacks.splice(i, 1);
  }
  for (const p of struck) hit(p, false);
  if (struck.size) updateHUD();
}

function update(dt) {
  if (phase !== 'playing') return;
  time += dt;
  remain = Math.max(0, remain - dt);
  if (remain === 0) {
    updateHUD();
    endRound();
    return;
  }
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i];
    e.life -= dt;
    e.x += e.vx * dt;
    e.y += e.vy * dt;
    e.vy += 270 * dt;
    if (e.life <= 0) effects.splice(i, 1);
  }
  const active = activePlayers();
  for (const p of active) updatePlayer(p, dt);
  if (guardAttacks.length) updateGuardAttacks(active);
  if (mode === 'duo') bumpPlayers(...active);
  for (const f of food) {
    if (f.count > 0) continue;
    f.regen -= dt;
    if (f.regen <= 0) {
      f.count = MAX_FRIES;
      sparkle(f.x, f.y, '#fff2a2', 8);
    }
  }
  if (Math.floor(time * 8) !== Math.floor((time - dt) * 8)) updateHUD();
}

// Check the carton and the tallest fries. Bridges are travel paths, not placement land.
const trayBounds = {left:-29, right:30, top:-41, bottom:29};

function pointOnLand(poly, x, y) {
  let inside = false;
  for (let i = 0; i < poly.length; i++) {
    const [ax, ay] = poly[i], [bx, by] = poly[(i + 1) % poly.length];
    if (ay === by && y === ay && x >= Math.min(ax, bx) && x <= Math.max(ax, bx)) return true;
    if (ax === bx && x === ax && y >= Math.min(ay, by) && y <= Math.max(ay, by)) return true;
    if ((ay > y) !== (by > y) && x < ax + (bx - ax) * (y - ay) / (by - ay)) inside = !inside;
  }
  return inside;
}

function trayFitsLand(x, y) {
  const l = x + trayBounds.left, r = x + trayBounds.right;
  const t = y + trayBounds.top, b = y + trayBounds.bottom;
  return maps[level].land.some(poly => {
    if (![[l,t],[l,b],[r,t],[r,b]].every(([xx, yy]) => pointOnLand(poly, xx, yy))) return false;
    // These dock outlines use horizontal and vertical edges. Reject any edge crossing the footprint.
    return poly.every(([ax, ay], i) => {
      const [bx, by] = poly[(i + 1) % poly.length];
      return Math.max(ax, bx) <= l || Math.min(ax, bx) >= r ||
        Math.max(ay, by) <= t || Math.min(ay, by) >= b;
    });
  });
}

function pointerXY(event) {
  const rect = canvas.getBoundingClientRect();
  return [(event.clientX - rect.left) * W / rect.width, (event.clientY - rect.top) * H / rect.height];
}

function cancelTrayDrag() {
  if (!trayDrag) return;
  const {pointer} = trayDrag;
  trayDrag = null;
  if (canvas.hasPointerCapture(pointer)) canvas.releasePointerCapture(pointer);
}

canvas.addEventListener('pointerdown', event => {
  if (phase !== 'playing' || trayDrag || event.button !== 0) return;
  const [x, y] = pointerXY(event);
  const tray = [...food].reverse().find(f =>
    x >= f.x + trayBounds.left && x <= f.x + trayBounds.right &&
    y >= f.y + trayBounds.top && y <= f.y + trayBounds.bottom);
  if (!tray) return;
  event.preventDefault();
  trayDrag = {tray, pointer:event.pointerId, dx:tray.x-x, dy:tray.y-y, x:tray.x, y:tray.y, valid:true};
  canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener('pointermove', event => {
  const [x, y] = pointerXY(event);
  if (!trayDrag) {
    canvas.style.cursor = phase === 'playing' && food.some(f =>
      Math.abs(x - f.x) <= 30 && y >= f.y - 41 && y <= f.y + 29) ? 'grab' : '';
    return;
  }
  if (trayDrag.pointer !== event.pointerId) return;
  trayDrag.x = x + trayDrag.dx;
  trayDrag.y = y + trayDrag.dy;
  trayDrag.valid = trayFitsLand(trayDrag.x, trayDrag.y);
  canvas.style.cursor = trayDrag.valid ? 'grabbing' : 'not-allowed';
});
canvas.addEventListener('pointerup', event => {
  if (trayDrag?.pointer !== event.pointerId) return;
  const [x, y] = pointerXY(event);
  const nextX = x + trayDrag.dx, nextY = y + trayDrag.dy;
  if (trayFitsLand(nextX, nextY)) {
    trayDrag.tray.x = nextX;
    trayDrag.tray.y = nextY;
    announce('薯条盒已摆好。');
  } else {
    announce('薯条盒需要整个放在陆地上，已回到原位。');
  }
  canvas.style.cursor = '';
  cancelTrayDrag();
});
for (const eventName of ['pointercancel', 'lostpointercapture']) {
  canvas.addEventListener(eventName, event => {
    if (trayDrag?.pointer === event.pointerId) cancelTrayDrag();
    canvas.style.cursor = '';
  });
}

function drawSea(now) {
  const {sea:colors} = maps[level];
  const sea = ctx.createLinearGradient(0, 0, 0, H);
  sea.addColorStop(0, colors[0]);
  sea.addColorStop(1, colors[1]);
  ctx.fillStyle = sea;
  ctx.fillRect(0, 0, W, H);

  ctx.beginPath();
  ctx.strokeStyle = '#ffffff5c';
  ctx.lineWidth = 2.7;
  for (let i = 0; i < 48; i++) {
    const x = ((i * 151 + now * 11 * (i % 2 ? 1 : -1)) % (W + 80) + W + 80) % (W + 80) - 40;
    const y = 50 + (i * 73) % 540;
    const radius = 11 + (i % 3) * 6;
    ctx.moveTo(x + radius * Math.cos(.2), y + radius * Math.sin(.2));
    ctx.arc(x, y, radius, .2, 2.4);
  }
  ctx.stroke();
}

function drawTerrain() {
  const map = maps[level];
  for (const poly of map.bridges || []) polygon(poly, '#a37d65', '#364b56', 3);
  for (const poly of map.land) {
    ctx.save();
    ctx.translate(0, 8);
    polygon(poly, '#2d648055', '#2d648055', 3);
    ctx.restore();
    polygon(poly, map.plank, '#293e52', 5);
    ctx.save();
    ctx.clip();
    for (let y = 75; y < H; y += 29) ln(0, y, W, y, '#fff0cb69', 2);
    for (let x = 35; x < W; x += 93) {
      ln(x, 70, x, H, '#9b705a88', 1.4);
      for (let y = 117; y < H; y += 68) oval(x + 8, y, 2.5, 2.5, '#9d745d');
    }
    ctx.restore();
  }
  label(...map.sign, 17, '#67463b');
  for (const [symbol, x, y] of map.props) label(symbol, x, y, 29);
}

function drawGuardZone(attack) {
  const {x, y, guard, strikeAt, fired} = attack;
  if (fired) {
    const progress = clamp((time - strikeAt) / GUARD_IMPACT_SECONDS, 0, 1);
    const wave = GUARD_RADIUS * (.35 + .65 * progress);
    ctx.save();
    ctx.globalAlpha = 1 - progress;
    oval(x, y, GUARD_RADIUS, GUARD_RADIUS, '#f5464770', '#a82332', 6);
    oval(x, y, wave, wave, '#ffc37527', '#fff1cc', 6);
    ctx.restore();
    return;
  }

  if (dist(guard.x, guard.y, x, y) > 20) {
    ctx.save();
    ctx.setLineDash([8, 6]);
    ln(guard.x, guard.y, x, y, '#8f2332b0', 3);
    ctx.restore();
  }
  const elapsed = clamp(1 - (strikeAt - time) / GUARD_WARNING_SECONDS[level], 0, 1);
  const fill = 'rgba(218,41,54,' + (.17 + elapsed * .16) + ')';
  oval(x, y, GUARD_RADIUS, GUARD_RADIUS, fill, '#fff1db', 8);
  oval(x, y, GUARD_RADIUS, GUARD_RADIUS, 'transparent', '#b52539', 4.5);
  ctx.beginPath();
  ctx.arc(x, y, GUARD_RADIUS - 7, -TAU / 4, -TAU / 4 + elapsed * TAU);

  ctx.lineWidth = 4;
  ctx.stroke();

function drawGuardCue(attack) {
  const {x, y, guard, strikeAt, fired} = attack;
  if (!fired && strikeAt - time < .25 && dist(guard.x, guard.y, x, y) > 28) {
    const progress = clamp(1 - (strikeAt - time) / .25, 0, 1);
    const fromY = guard.y - 34;

    const propY = fromY + (y - fromY) * progress - Math.sin(progress * Math.PI) * 29;

  rr(badgeX - 69, badgeY - 14, 138, 28, 8, '#9b2636', '#fff0d5', 2.3);

function drawBird(p, now) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.stun > 0 ? Math.sin(now * 30) * .25 : 0);
  if (p.invuln > 0) ctx.globalAlpha = .7 + .3 * Math.sin(now * 26);
  const blue = p.id === 1;
  const feathers = blue ? '#accdeb' : '#fff0c9';
  const outline = '#284354';
  const flap = Math.sin(now * 19 + p.id) * .45;
  const talonY = p.grip ? 47 : 40;

  oval(0, 51, 41, 9, '#29425644');
  for (const side of [-1, 1]) {
    ctx.save();
    ctx.rotate(side * (.3 - flap));
    oval(side * 34, -3, 30, 12, feathers, outline, 2.4);
    ctx.restore();
    ln(side * 12, 30, side * 14, talonY, outline, 7);
    ln(side * 12, 30, side * 14, talonY, '#ffb557', 4);
  }

  // Individual fries stay with the bird and sit between its toes.
  for (let i = 0; i < p.carry; i++) {
    ctx.save();
    ctx.translate(i % 2 ? 13 : -13, talonY + 6 + (i >= 2 ? 4 : 0));
    ctx.rotate((i % 2 ? .55 : -.62) + (i >= 2 ? .46 : 0) + Math.sin(now * 10) * .08);
    rr(-5 + (i >= 2 ? 7 : 0), -12, 10, 32, 2, '#ffe460', '#8a4f29', 2);
    ctx.restore();
  }
  for (const side of [-1, 1]) {
    for (const toe of [-1, 0, 1]) {
      ln(side * 14, talonY - 3, side * 14 + toe * 5, talonY + 2, outline, 4.5);
      ln(side * 14, talonY - 3, side * 14 + toe * 5, talonY + 2, '#ffb557', 2.6);
    }
  }

  oval(0, 6, 33, 32, feathers, outline, 3);
  if (blue) {
    polygon([[-22,7],[-39,17],[-54,10],[-48,21],[-56,28],[-35,28],[-17,17]], '#3980be', outline, 2);
    rr(-30, 0, 58, 12, 5, '#3980be', outline, 2);
  }
  oval(3, -25, 31, 32, blue ? '#e6f4ff' : '#fffdf4', outline, 3);
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(3, -25, 27.5, 28, 0, 0, TAU);
  ctx.clip();
  if (p.avatar) ctx.drawImage(p.avatar, -26, -53, 58, 58);
  else {
    oval(-8, -28, 4.8, 6.5, '#324256');
    oval(14, -28, 4.8, 6.5, '#324256');
    oval(-13, -18, 5, 3, '#ffb3b2');
    oval(19, -18, 5, 3, '#ffb3b2');
  }
  ctx.restore();
  if (p.grip) {
    ln(-19, -44, -1, -37, outline, 4);
    ln(12, -37, 27, -44, outline, 4);
  } else {
    ln(-18, -43, -5, -46, outline, 4);
    ln(13, -46, 27, -43, outline, 4);
  }
  polygon([[-14,-17],[21,-17],[34,-9],[7,-3],[-12,-8]], blue ? '#ffad70' : '#ffcf50', outline, 2.4);
  if (!blue) {
    rr(-22, -71, 41, 17, 6, '#f5ac3f', outline, 2.6);
    rr(-27, -59, 57, 9, 4, '#ffd26b', outline, 2.6);
  }
  ctx.restore();

  const chip = blue ? '#b8dcf8' : '#ffdd7b';
  rr(p.x - 17, p.y - 94, 34, 18, 5, chip, outline, 1.7);
  label(p.stun > 0 ? '💫' : 'P' + (p.id + 1), p.x, p.y - 84, 11);
}

const terrainLayer = document.createElement('canvas');
terrainLayer.width = W;
terrainLayer.height = H;
const terrainCtx = terrainLayer.getContext('2d');
let terrainLevel = -1;
let terrainMode;

function render(now) {
  if (terrainLevel !== level || terrainMode !== mode) {
    ctx.clearRect(0, 0, W, H);
    drawTerrain();
    for (const p of activePlayers()) drawNest(p);
    terrainCtx.clearRect(0, 0, W, H);
    terrainCtx.drawImage(canvas, 0, 0);
    terrainLevel = level;
    terrainMode = mode;
  }
  drawSea(now);
  ctx.drawImage(terrainLayer, 0, 0);
  for (const attack of guardAttacks) drawGuardZone(attack);
  for (const f of food) {
    if (trayDrag?.tray !== f) drawFood(f);
  }
  for (const g of guards) drawGuard(g);
  for (const p of activePlayers()) drawBird(p, now);
  for (const e of effects) oval(e.x, e.y, e.r, e.r * .9, e.color);
  for (const attack of guardAttacks) drawGuardCue(attack);
  if (trayDrag) {
    const {tray, x, y, valid} = trayDrag;
    ctx.save();
    ctx.globalAlpha = .86;
    rr(x - 30, y - 42, 61, 72, 8, valid ? '#e7ffd494' : '#ffd4d6b3', valid ? '#315b43' : '#ab3e40', 3);
    drawFood(tray, x, y);
    ctx.restore();
  }
}

let stream = null, handTracker = null, cameraSession = 0;
let openingCamera = null, loadingModel = null, starting = false, startRequest = 0;
let lastTrackTime = -Infinity, lastVideoTime = -1, lastFreshFrame = 0;
const livebox = $('livebox');
const trackingFrame = document.createElement('canvas');
const trackingCtx = trackingFrame.getContext('2d', {alpha:false});

function cameraStatus(message, error = false) {
  for (const node of [$('cameraNote'), $('cameraFeedback')]) {
    node.textContent = message;
    node.classList.toggle('error', error);
  }
  $('cameraFeedback').hidden = false;
}

function photoCrop(player) {
  const w = video.videoWidth, h = video.videoHeight;
  const centerX = mode === 'solo' ? .5 : player.id === 0 ? .25 : .75;
  const size = Math.min(h * .59, w * (mode === 'solo' ? .62 : .38));
  return {centerX, centerY:.43, size, w, h};
}

function updatePhotoGuides() {
  if (!video.videoWidth || !video.videoHeight) return;
  livebox.style.aspectRatio = video.videoWidth + ' / ' + video.videoHeight;
  for (const p of activePlayers()) {
    const {centerX, centerY, size, w, h} = photoCrop(p);
    const guide = $('guide' + (p.id + 1));
    Object.assign(guide.style, {left:centerX * 100 + '%', top:centerY * 100 + '%',
      width:size / w * 100 + '%', height:size / h * 100 + '%'});
  }
  $('guide2').hidden = mode === 'solo';
}

function saveAvatar(p, avatar) {
  p.avatar = avatar;
  const src = avatar.toDataURL('image/jpeg', .9);
  for (const prefix of ['photo', 'hudPhoto']) {
    const image = $(prefix + (p.id + 1));
    image.src = src;
    image.hidden = false;
  }
}

function newAvatar() {
  const photo = document.createElement('canvas');
  photo.width = photo.height = 192;
  return photo;
}

function captureFaces() {
  if (!stream || video.readyState < 2 || !video.videoWidth) return;
  for (const p of activePlayers()) {
    p.avatarVersion++;
    const {centerX, centerY, size, w, h} = photoCrop(p);
    const photo = newAvatar();
    const g = photo.getContext('2d');
    g.translate(photo.width, 0);
    g.scale(-1, 1);
    g.drawImage(video, (1 - centerX) * w - size / 2, centerY * h - size / 2,
      size, size, 0, 0, photo.width, photo.height);
    saveAvatar(p, photo);
  }
  cameraStatus('头像已拍好。可以重拍或开始游戏。');
  updateSetup();
}

function closeCamera() {
  cameraSession++;
  openingCamera = null;
  loadingModel = null;
  handTracker?.close();
  handTracker = null;
  stream?.getTracks().forEach(track => track.stop());
  stream = null;
  video.srcObject = null;
  livebox.hidden = true;
  $('cameraPlaceholder').hidden = false;
  $('cameraBtn').textContent = '📷 开启摄像头';
  $('cameraBtn').disabled = false;
  $('retryModel').hidden = true;
  handCanvas.hidden = true;
  if (controlMode === 'camera') setControl('keyboard');
  updateSetup();
}

function cameraError(error) {
  if (error.name === 'NotAllowedError') return '摄像头权限被拒绝。可在浏览器中允许权限后重试，或使用键盘。';
  if (error.name === 'NotReadableError') return '摄像头暂不可用。关闭正在使用它的其他软件后重试。';
  return '摄像头启动失败。请检查摄像头连接，或使用键盘。';
}

function openCamera() {
  if (openingCamera) return openingCamera;
  if (stream) return Promise.resolve(true);
  if (!navigator.mediaDevices?.getUserMedia) {
    cameraStatus('此页面无法访问摄像头。可用 Chrome 打开本地 HTML，或通过 localhost / HTTPS 打开。', true);
    return Promise.resolve(false);
  }
  const session = ++cameraSession;
  $('cameraBtn').disabled = true;
  cameraStatus('等待浏览器授予摄像头权限…');
  openingCamera = (async () => {
    try {
      const media = await navigator.mediaDevices.getUserMedia({
        audio:false, video:{width:{ideal:960}, height:{ideal:540}, frameRate:{ideal:30}, facingMode:'user'}
      });
      if (session !== cameraSession) {
        media.getTracks().forEach(track => track.stop());
        return false;
      }
      stream = media;
      video.srcObject = media;
      await video.play();
      if (session !== cameraSession) return false;
      for (const track of media.getVideoTracks()) {
        track.addEventListener('ended', () => {
          if (stream !== media) return;
          closeCamera();
          cameraStatus('摄像头已断开。可继续使用键盘。', true);
          if (phase === 'playing') updateHUD();
        }, {once:true});
      }
      livebox.hidden = false;
      $('cameraPlaceholder').hidden = true;
      $('cameraBtn').textContent = '关闭摄像头';
      updatePhotoGuides();
      cameraStatus('摄像头已开启。');
      updateSetup();
      return true;
    } catch (error) {
      if (session === cameraSession) {
        closeCamera();
        cameraStatus(cameraError(error), true);
      }
      return false;
    } finally {
      if (session === cameraSession) {
        openingCamera = null;
        $('cameraBtn').disabled = false;
      }
    }
  })();
  return openingCamera;
}

function trackerFrom(root) {
  let expired = false;
  let timeout;
  const task = (async () => {
    const vision = await import(root + '/vision_bundle.mjs');
    if (expired) return null;
    const wasm = await vision.FilesetResolver.forVisionTasks(root + '/wasm');
    if (expired) return null;
    const tracker = await vision.HandLandmarker.createFromOptions(wasm, {
      baseOptions:{
        modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
        delegate:'CPU'
      },
      runningMode:'VIDEO', numHands:mode === 'solo' ? 1 : 2,
      minHandDetectionConfidence:.42, minHandPresenceConfidence:.45, minTrackingConfidence:.46
    });
    if (expired) {
      tracker.close();
      return null;
    }
    return tracker;
  })();
  const limit = new Promise((_, reject) => {
    timeout = setTimeout(() => { expired = true; reject(new Error('模型加载超时')); }, 20000);
  });
  return Promise.race([task, limit]).finally(() => clearTimeout(timeout));
}

function loadTracker() {
  if (handTracker) return Promise.resolve(true);
  if (loadingModel) return loadingModel;
  const session = cameraSession;
  const sources = [
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21',
    'https://unpkg.com/@mediapipe/tasks-vision@0.10.21'
  ];
  $('retryModel').hidden = true;
  loadingModel = (async () => {
    for (const source of sources) {
      if (session !== cameraSession) return false;
      try {
        cameraStatus('正在加载手势识别模型…');
        const tracker = await trackerFrom(source);
        if (session !== cameraSession) {
          tracker.close();
          return false;
        }
        handTracker = tracker;
        lastTrackTime = -Infinity;
        lastVideoTime = -1;
        return true;
      } catch (error) {
        console.warn('Hand model load failed', error);
      }
    }
    if (session === cameraSession) cameraStatus('手势识别加载失败。可以用键盘游玩，联网后点重试。', true);
    return false;
  })().finally(() => {
    if (session === cameraSession) loadingModel = null;
  });
  return loadingModel;
}

function handCandidate(landmarks, category) {
  const palm = [0, 5, 9, 17];
  const x = palm.reduce((sum, i) => sum + landmarks[i].x, 0) / palm.length;
  const y = palm.reduce((sum, i) => sum + landmarks[i].y, 0) / palm.length;
  return {landmarks, x, y, side:x < .5 ? 0 : 1, handedness:category?.score >= .8 ? category.categoryName : null};
}

function handMatchCost(player, hand, now) {
  if (!hand) return .47;
  const previous = player.handTrack;
  if (previous && now - previous.time < 240) {
    const distance = dist(hand.x, hand.y, previous.x, previous.y);
    const changedHand = previous.handedness && hand.handedness && previous.handedness !== hand.handedness;
    if (distance < (hand.side === player.id ? .23 : .15)) {
      return distance + (changedHand ? .14 : 0);
    }
  }
  return hand.side === player.id ? .29 + Math.abs(hand.x - (player.id ? .75 : .25)) * .25 : Infinity;
}

function assignHands(result, now) {
  const hands = (result.landmarks || []).map((landmarks, i) => handCandidate(landmarks, result.handedness?.[i]?.[0]));
  if (mode === 'solo') return [hands[0] || null];

  // Match both tracks together so one detection can't drive both players.
  const choices = [null, ...hands];
  let matched = [null, null];
  let best = Infinity;
  for (const left of choices) {
    for (const right of choices) {
      if (left && left === right) continue;
      const cost = handMatchCost(players[0], left, now) + handMatchCost(players[1], right, now);
      if (cost < best) {
        best = cost;
        matched = [left, right];
      }
    }
  }
  return matched;
}

function applyHand(p, hand, now) {
  if (!hand) {
    // Keep the track briefly for matching. Stop motion and cancel the pinch immediately.
    clearTracking(p, true);
    return;
  }
  const {landmarks, x, y, handedness} = hand;
  const nx = mode === 'solo' ? x : x * 2 - p.id;
  p.handTrack = {x, y, handedness, time:now};
  p.seen = true;
  p.aimX = 40 + clamp((nx - .10) / .80, 0, 1) * (W - 80);
  p.aimY = 100 + clamp((y - .10) / .80, 0, 1) * (H - 145);

  const aspect = trackingFrame.width / trackingFrame.height;
  const gapBetween = (i, j) => Math.hypot((landmarks[i].x - landmarks[j].x) * aspect, landmarks[i].y - landmarks[j].y);
  const palmSize = Math.max(.035, gapBetween(0, 9), gapBetween(5, 17));
  const gap = gapBetween(4, 8) / palmSize;
  if (!p.pinched && gap < .43) {
    p.pinched = true;
    if (!p.auto && p.stun <= 0) p.grip = true;
  }
  if (!p.pinched) return;
  p.openFrames = gap > .55 ? p.openFrames + 1 : 0;
  if (p.openFrames >= 2) {
    releaseGrip(p, true);
    p.pinched = false;
    p.openFrames = 0;
  }
}

function captureTrackingFrame() {
  const scale = Math.min(1, 768 / Math.max(video.videoWidth, video.videoHeight));
  const w = Math.round(video.videoWidth * scale), h = Math.round(video.videoHeight * scale);
  if (trackingFrame.width !== w || trackingFrame.height !== h) {
    trackingFrame.width = handCanvas.width = w;
    trackingFrame.height = handCanvas.height = h;
  }
  trackingCtx.setTransform(-1, 0, 0, 1, w, 0);
  trackingCtx.drawImage(video, 0, 0, w, h);
}

const handChains = [[0,1,2,3,4],[0,5,6,7,8],[0,9,10,11,12],[0,13,14,15,16],[0,17,18,19,20],[5,9,13,17]];

function drawTrackingPreview(hands) {
  const w = handCanvas.width, h = handCanvas.height;
  // The preview and landmarks use the same already mirrored frame.
  hctx.drawImage(trackingFrame, 0, 0, w, h);
  if (mode === 'duo') {
    hctx.strokeStyle = '#ffffffbf';
    hctx.lineWidth = 3;
    hctx.setLineDash([9, 7]);
    hctx.beginPath();
    hctx.moveTo(w / 2, 0);
    hctx.lineTo(w / 2, h);
    hctx.stroke();
    hctx.setLineDash([]);
  }
  hands.forEach((hand, i) => {
    if (!hand) return;
    const color = i === 0 ? '#ffe078' : '#86c9ff';
    hctx.beginPath();
    for (const chain of handChains) {
      chain.forEach((index, j) => {
        const point = hand.landmarks[index];
        const x = point.x * w, y = point.y * h;
        if (j === 0) hctx.moveTo(x, y);
        else hctx.lineTo(x, y);
      });
    }
    hctx.lineCap = 'round';
    hctx.lineJoin = 'round';
    hctx.strokeStyle = '#182c42';
    hctx.lineWidth = 6;
    hctx.stroke();
    hctx.strokeStyle = color;
    hctx.lineWidth = 3.5;
    hctx.stroke();

    const tips = [hand.landmarks[4], hand.landmarks[8]];
    if (players[i].grip) {
      const x = (tips[0].x + tips[1].x) * w / 2;
      const y = (tips[0].y + tips[1].y) * h / 2;
      hctx.beginPath();
      hctx.arc(x, y, 8, 0, TAU);
      hctx.fillStyle = color;
      hctx.fill();
    }
  });
  handCanvas.hidden = false;
}

function updateCamera(now) {
  if (controlMode !== 'camera' || !handTracker || now - lastTrackTime < 30) return;
  if (video.readyState < 2 || !video.videoWidth || video.currentTime === lastVideoTime) {
    if (now - lastFreshFrame > 200) {
      for (const p of activePlayers()) clearTracking(p);
      handCanvas.hidden = true;
    }
    return;
  }
  lastTrackTime = now;
  lastFreshFrame = now;
  lastVideoTime = video.currentTime;
  try {
    captureTrackingFrame();
    const hands = assignHands(handTracker.detectForVideo(trackingFrame, now), now);
    for (const p of activePlayers()) applyHand(p, hands[p.id], now);
    drawTrackingPreview(hands);
  } catch (error) {
    console.warn('Hand tracking stopped', error);
    handTracker.close();
    handTracker = null;
    setControl('keyboard');
    $('retryModel').hidden = false;
    cameraStatus('手势追踪中断，已切换为键盘。可点击重试。', true);
    updateHUD();
  }
}

function showGame(nextControl, retry = false) {
  $('setup').hidden = true;
  $('game').hidden = false;
  $('gameActions').hidden = false;
  $('gameCameraDock').append(livebox);
  $('photoGuides').hidden = true;
  $('camLabels').hidden = false;
  $('retryModel').hidden = !retry;
  setControl(nextControl);
  resetMatch();
}

async function startGesture() {
  const request = ++startRequest;
  starting = true;
  enableAudio();
  updateSetup();
  const cameraReady = await openCamera();
  if (request !== startRequest) return;
  const tracking = cameraReady && await loadTracker();
  if (request !== startRequest) return;
  starting = false;
  updateSetup();
  if (tracking) cameraStatus('手势识别已就绪。');
  showGame(tracking ? 'camera' : 'keyboard', cameraReady && !tracking);
}

function startKeyboard() {
  startRequest++;
  starting = false;
  closeCamera();
  $('cameraFeedback').hidden = true;
  enableAudio();
  showGame('keyboard');
}

function showSetup() {
  phase = 'setup';
  keys.clear();
  cancelTrayDrag();
  closeCamera();
  $('game').hidden = true;
  $('gameActions').hidden = true;
  $('setup').hidden = false;
  $('setupCameraDock').append(livebox);
  $('photoGuides').hidden = false;
  $('camLabels').hidden = true;
  cameraStatus('手势识别首次加载需要联网。');
  $('cameraFeedback').hidden = true;
  updateSetup();
  $('modeTitle').scrollIntoView({block:'nearest'});
}

const isGameKey = code => keyBindings.some(binding => Object.values(binding).includes(code));
window.addEventListener('keydown', event => {
  if (phase !== 'playing' || controlMode !== 'keyboard' || !isGameKey(event.code) ||
      event.target instanceof HTMLInputElement || event.altKey || event.metaKey || event.ctrlKey) return;
  event.preventDefault();
  keys.add(event.code);
});
window.addEventListener('keyup', event => {
  const wasDown = keys.delete(event.code);
  if (!wasDown || phase !== 'playing' || controlMode !== 'keyboard') return;
  const player = activePlayers().find(p => keyBindings[p.id].grip === event.code);
  if (player) releaseGrip(player, true);
});
window.addEventListener('blur', () => {
  if (phase !== 'playing') return;
  keys.clear();
  cancelTrayDrag();
  for (const p of activePlayers()) clearTracking(p);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden && phase === 'playing') {
    keys.clear();
    for (const p of activePlayers()) clearTracking(p);
  }
});

$('soloMode').onclick = () => setMode('solo');
$('duoMode').onclick = () => setMode('duo');
$('useDefaults').onclick = () => { defaultsAccepted = true; updateSetup(); };
$('cameraBtn').onclick = () => {
  if (stream) {
    closeCamera();
    startRequest++;
    starting = false;
    updateSetup();
    cameraStatus('摄像头已关闭。');
  } else openCamera();
};
$('snapFaces').onclick = captureFaces;
$('goCamera').onclick = startGesture;
$('goKeyboard').onclick = startKeyboard;
$('changeMode').onclick = showSetup;
$('retryModel').onclick = async () => {
  if (!stream) return;
  const session = cameraSession;
  const tracking = await loadTracker();
  if (session !== cameraSession) return;
  $('retryModel').hidden = tracking;
  if (tracking) {
    setControl('camera');
    cameraStatus('手势识别已就绪。');
    updateHUD();
  }
};
$('useKeyboard').onclick = () => {
  closeCamera();
  cameraStatus('已切换为键盘。');
  updateHUD();
};
$('sound').onclick = () => {
  muted = !muted;
  $('sound').textContent = muted ? '🔇 音效关闭' : '🔊 音效开启';
  if (!muted) {
    enableAudio();
    sound('deposit');
  }
};
$('rules').onclick = () => {
  pauseGame();
  const controlTip = mode === 'duo' ? '双人各用镜头一侧，共用一张地图；俯冲可撞掉对手抓到的薯条。' : '单人使用整幅镜头，避开码头游客。';
  showDialog('玩法', '张手移动，捏合抓薯条，手留在镜头内松开就会回巢。' + controlTip +
    '抓到薯条会引起游客警戒。倒计时结束前飞出红圈。被击中会掉光脚上的薯条，已带回巢的分数保留。' +
    '薯条盒可用鼠标或触屏在陆地上摆放。' + $('inGameHint').textContent.split('用鼠标')[0],
    '继续游戏', () => { phase = 'playing'; }, true);
  $('dialogClose').hidden = true;
};
$('restart').onclick = () => {
  pauseGame();
  showDialog('重新开局？', '从第一关重新开始，累计分数归零。', '确认重开', resetMatch, true);
};
for (const p of players) {
  $('face' + (p.id + 1)).addEventListener('change', event => {
    const file = event.target.files?.[0];
    event.target.value = '';
    if (!file) return;
    const version = ++p.avatarVersion;
    const url = URL.createObjectURL(file);
    const image = new Image();
    image.onload = () => {
      URL.revokeObjectURL(url);
      if (version !== p.avatarVersion) return;
      const avatar = newAvatar();
      const size = Math.min(image.naturalWidth, image.naturalHeight);
      avatar.getContext('2d').drawImage(image, (image.naturalWidth - size) / 2,
        (image.naturalHeight - size) / 2, size, size, 0, 0, avatar.width, avatar.height);
      saveAvatar(p, avatar);
      updateSetup();
    };
    image.onerror = () => {
      URL.revokeObjectURL(url);
      if (version === p.avatarVersion) cameraStatus('图片读取失败，请换一张照片。', true);
    };
    image.src = url;
  });
}
video.addEventListener('loadeddata', updateSetup);
video.addEventListener('resize', updatePhotoGuides);
window.addEventListener('pagehide', closeCamera);

function loop(now) {
  const dt = Math.min(.04, (now - last) / 1000);
  last = now;
  if (phase === 'playing') {
    updateCamera(now);
    update(dt);
  }
  if (!$('game').hidden) render(now / 1000);
  requestAnimationFrame(loop);
}

setMode('duo');
requestAnimationFrame(loop);
})();
</script>
